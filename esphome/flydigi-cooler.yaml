substitutions:
  name: flydigi-cooler
  friendly_name: Laptop Cooler
  # Bluetooth address of the cooler. Flash once with any value, then read the real one from
  # the logs ("Found Flydigi cooler ... at XX:XX:...") and flash again.
  cooler_mac: "00:00:00:00:00:00"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - flydigi.h

esp32:
  board: esp32dev # change to match your board (any ESP32 with Bluetooth; the ESP32-S2 has none)
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome # encrypted with the api key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {} # fallback hotspot if Wi-Fi is unreachable

captive_portal:

globals:
  # User picked "Custom speed". Realtime mode is dropped whenever the cooler loses its last
  # host, so this is what gets re-applied on reconnect.
  - id: custom_active
    type: bool
    restore_value: true
    initial_value: "false"
  # When we last sent something. Status frames lag commands by up to 500 ms, so they
  # don't get to overrule custom_active right after a write.
  - id: last_cmd_ms
    type: uint32_t
    initial_value: "0"

esp32_ble_tracker:
  on_ble_advertise:
    - then:
        - lambda: |-
            const std::string &n = x.get_name();
            if (n.find("BS2") != std::string::npos || n.find("BS3") != std::string::npos ||
                n.find("lydigi") != std::string::npos || n.find("LYDIGI") != std::string::npos)
              ESP_LOGI("flydigi", "Found Flydigi cooler '%s' at %012llX (add the colons)", n.c_str(),
                       (unsigned long long) x.address_uint64());

ble_client:
  - id: cooler
    mac_address: ${cooler_mac}
    on_connect:
      - binary_sensor.template.publish:
          id: link_state
          state: true
      - lambda: id(last_cmd_ms) = millis();
      - delay: 1s
      - if:
          condition:
            lambda: return id(custom_active);
          then:
            - script.execute:
                id: apply_custom
                rpm: !lambda return id(target_speed).state;
    on_disconnect:
      - binary_sensor.template.publish:
          id: link_state
          state: false
      - lambda: |-
          id(fan_speed).publish_state(NAN);
          id(target_rpm).publish_state(NAN);

script:
  # The only path that writes to the cooler. Paced so the firmware's 5 ms RX loop never drops a frame.
  - id: cooler_send
    mode: queued
    max_runs: 10
    parameters:
      cmd: int
      arg: int
    then:
      - if:
          condition:
            lambda: return !flydigi::build(cmd, arg).empty();
          then:
            - lambda: id(last_cmd_ms) = millis();
            - ble_client.ble_write:
                id: cooler
                service_uuid: "FFF0"
                characteristic_uuid: "FFF2"
                value: !lambda return flydigi::build(cmd, arg);
            - delay: 30ms
  - id: apply_custom
    mode: queued
    parameters:
      rpm: int
    then:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_ENTER_REALTIME;
          arg: 0
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_SET_RPM;
          arg: !lambda return rpm;

sensor:
  # Raw notification stream. Fans the decoded status out to the entities below.
  - platform: ble_client
    type: characteristic
    id: status_stream
    internal: true
    ble_client_id: cooler
    service_uuid: "FFF0"
    characteristic_uuid: "FFF1"
    notify: true
    update_interval: never
    lambda: |-
      static flydigi::Parser parser;
      static flydigi::Status last;
      static bool have_last = false;
      flydigi::Status s;
      if (!parser.feed(x, s))
        return NAN;

      if (!s.realtime && id(custom_active) && millis() - id(last_cmd_ms) > 3000)
        id(custom_active) = false; // left realtime on its own, e.g. the cooler's button

      bool first = !have_last;
      if (first || s.rpm != last.rpm) id(fan_speed).publish_state(s.rpm);
      if (first || s.target_rpm != last.target_rpm) id(target_rpm).publish_state(s.target_rpm);
      if (first || s.asleep != last.asleep) id(running).publish_state(!s.asleep);
      if (first || s.strip != last.strip) id(strip_power).publish_state(s.strip);
      if (first || s.gear_leds != last.gear_leds) id(gear_leds).publish_state(s.gear_leds);
      if (first || s.realtime != last.realtime || s.gear != last.gear)
        id(fan_mode).publish_state(s.realtime ? "Custom speed" : "Gear " + std::to_string(s.gear));
      if (first || s.standby != last.standby) {
        static const char *const names[] = {"Never", "When disconnected", "60 s after disconnect", "Never"};
        id(standby_mode).publish_state(names[s.standby]);
      }
      if (first || s.supply != last.supply) {
        static const char *const names[] = {"Detecting", "5 V (max 2700 RPM)", "9 V (max 3300 RPM)", "PD 20 V (full speed)"};
        id(power_supply).publish_state(names[s.supply]);
      }
      last = s;
      have_last = true;
      return NAN;

  - platform: template
    id: fan_speed
    name: Fan speed
    unit_of_measurement: RPM
    icon: mdi:fan
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: target_rpm
    name: Target speed
    unit_of_measurement: RPM
    icon: mdi:fan-chevron-up
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never

  - platform: ble_client
    type: rssi
    ble_client_id: cooler
    name: Bluetooth signal
    entity_category: diagnostic
    update_interval: 60s

binary_sensor:
  - platform: template
    id: link_state
    name: Connected
    device_class: connectivity
    entity_category: diagnostic

  - platform: template
    id: running
    name: Running
    device_class: running

text_sensor:
  - platform: template
    id: power_supply
    name: Power supply
    icon: mdi:power-plug
    entity_category: diagnostic
    update_interval: never

select:
  - platform: template
    id: fan_mode
    name: Fan mode
    icon: mdi:fan
    options: ["Gear 1", "Gear 2", "Gear 3", "Gear 4", "Custom speed"]
    set_action:
      - if:
          condition:
            lambda: return x == "Custom speed";
          then:
            - lambda: id(custom_active) = true;
            - script.execute:
                id: apply_custom
                rpm: !lambda return id(target_speed).state;
          else:
            - lambda: id(custom_active) = false;
            - script.execute:
                id: cooler_send
                cmd: !lambda return flydigi::CMD_SELECT_GEAR;
                arg: !lambda return x.c_str()[x.size() - 1] - '0';

  - platform: template
    id: standby_mode
    name: Auto standby
    icon: mdi:power-sleep
    entity_category: config
    options: ["Never", "When disconnected", "60 s after disconnect"]
    set_action:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_STANDBY;
          arg: !lambda |-
            if (x == "When disconnected") return 1;
            if (x == "60 s after disconnect") return 2;
            return 0;

number:
  - platform: template
    id: target_speed
    name: Custom speed
    icon: mdi:speedometer
    unit_of_measurement: RPM
    min_value: 1300
    max_value: 4000
    step: 100
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 2400
    set_action:
      # Moving the slider switches to custom speed.
      - lambda: id(custom_active) = true;
      - script.execute:
          id: apply_custom
          rpm: !lambda return x;

switch:
  - platform: template
    id: strip_power
    name: Light strip
    icon: mdi:led-strip-variant
    optimistic: true
    turn_on_action:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_STRIP_POWER;
          arg: 1
    turn_off_action:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_STRIP_POWER;
          arg: 0

  - platform: template
    id: gear_leds
    name: Gear indicator LEDs
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    turn_on_action:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_GEAR_LEDS;
          arg: 1
    turn_off_action:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_GEAR_LEDS;
          arg: 0

  # Holding the Bluetooth link keeps the cooler awake. Turning this off releases it, so with
  # "Auto standby" set the cooler goes to sleep (unless the laptop is still connected to it).
  - platform: ble_client
    ble_client_id: cooler
    name: Bluetooth link enabled
    icon: mdi:bluetooth-connect

button:
  - platform: template
    name: Wake
    icon: mdi:power
    on_press:
      - script.execute:
          id: cooler_send
          cmd: !lambda return flydigi::CMD_WAKE;
          arg: 0
